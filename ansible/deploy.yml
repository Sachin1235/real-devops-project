---
- name: Deploy DevOps Application
  hosts: localhost
  connection: local

  tasks:

  - name: Create Docker network
    docker_network:
      name: app_net
      state: present

  # ---------- MYSQL CONTAINER ----------
  - name: Run MySQL container (persistent)
    docker_container:
      name: mysql
      image: mysql:8
      state: started
      restart_policy: always
      ports:
        - "3306:3306"
      env:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_DATABASE: petclinic
        MYSQL_USER: petclinic
        MYSQL_PASSWORD: petclinic
      networks:
        - name: app_net

  - name: Wait for MySQL to be ready
    wait_for:
      host: 127.0.0.1
      port: 3306
      delay: 5
      timeout: 120

  # ---------- SPRING BOOT CONTAINER ----------
  - name: Remove old Spring container if exists
    docker_container:
      name: spring_app
      state: absent
      force_kill: true

  - name: Run Spring Boot container
    docker_container:
      name: spring_app
      image: localhost:8083/devops-app:latest
      state: started
      restart_policy: always
      ports:
        - "8085:8080"
      env:
        SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/petclinic
        SPRING_DATASOURCE_USERNAME: petclinic
        SPRING_DATASOURCE_PASSWORD: petclinic
        SPRING_JPA_HIBERNATE_DDL_AUTO: update
      networks:
        - name: app_net
